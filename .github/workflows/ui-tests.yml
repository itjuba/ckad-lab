name: Web UI tests

on:
  push:
    paths: ['sim/ui/**', '.github/workflows/ui-tests.yml']
  pull_request:
    paths: ['sim/ui/**', '.github/workflows/ui-tests.yml']

jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sim/ui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sim/ui/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sim/ui/web/playwright-report
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim/ui/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sim/ui/server/go.mod
      - run: go vet ./...
      - run: go build ./...
